<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Beneficios · Haztap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================
   DESIGN SYSTEM — Haztap Beneficios · Neo-Fintech
   ===================================================== */
:root {
  --bg:          #f2f2f7;
  --surface:     #ffffff;
  --surface-2:   #f7f7fa;
  --surface-3:   #efeff4;

  --text-1:      #111118;
  --text-2:      #3c3c43;
  --text-3:      #8e8e9a;

  --accent:      #1abcfe;
  --accent-d:    #0099d9;
  --accent-glow: rgba(26,188,254,0.22);
  --accent-soft: rgba(26,188,254,0.10);
  --accent-mid:  rgba(26,188,254,0.55);

  --dark-1: #0f1117;
  --dark-2: #181b24;
  --dark-3: #22263a;

  --r-sm:   6px;
  --r-md:   12px;
  --r-lg:   18px;
  --r-xl:   24px;
  --r-pill: 9999px;

  --sh-xs: 0 1px 2px rgba(0,0,0,.06);
  --sh-sm: 0 2px 8px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
  --sh-md: 0 4px 20px rgba(0,0,0,.10), 0 1px 4px rgba(0,0,0,.05);
  --sh-lg: 0 12px 40px rgba(0,0,0,.16), 0 2px 8px rgba(0,0,0,.06);

  --font: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --ease: cubic-bezier(.22,1,.36,1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text-1);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  display: flex;
  justify-content: center;
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration:.001ms!important; transition-duration:.001ms!important; }
}

/* =====================================================
   ESTRUCTURA
   ===================================================== */
.app { width: 100%; max-width: 540px; padding: 0 0 64px; }

/* =====================================================
   HERO — HEADER + INTRO
   ===================================================== */
.hero-wrap {
  background: linear-gradient(180deg, var(--dark-1) 0%, var(--dark-2) 100%);
  padding: 36px 24px 48px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
/* Aurora decorativa */
.hero-wrap::before {
  content: "";
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 70% 50% at 50% -5%, rgba(26,188,254,.20) 0%, transparent 65%),
    radial-gradient(ellipse 40% 30% at 85% 105%, rgba(26,188,254,.08) 0%, transparent 60%);
  pointer-events: none;
}
/* Línea inferior de acento */
.hero-wrap::after {
  content: "";
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
}

.topbar {
  position: relative; z-index: 1;
  margin-bottom: 32px;
}
.logo-text {
  font-size: 24px; font-weight: 800; letter-spacing: -0.04em;
  color: #fff; line-height: 1;
}
.logo-text em { font-style: normal; color: var(--accent); }
.comercio-name {
  font-size: 13px; color: rgba(255,255,255,.5);
  margin-top: 5px; font-weight: 500;
}

.hero-content { position: relative; z-index: 1; }
.hero-eyebrow {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(26,188,254,.15);
  border: 1px solid rgba(26,188,254,.3);
  border-radius: var(--r-pill);
  padding: 4px 12px;
  font-size: 11px; font-weight: 700; letter-spacing: .09em;
  text-transform: uppercase; color: var(--accent);
  margin-bottom: 18px;
}
.hero-content h1 {
  font-size: clamp(24px, 6vw, 30px);
  font-weight: 800; letter-spacing: -0.04em;
  color: #fff; line-height: 1.18;
  margin-bottom: 14px;
}
.hero-content h1 span { color: var(--accent); }
.hero-content p {
  font-size: 14px; color: rgba(255,255,255,.60);
  max-width: 360px; margin: 0 auto;
  line-height: 1.6; font-weight: 500;
}

/* =====================================================
   EARN STRIP — STATS DE ACUMULACIÓN
   ===================================================== */
.earn-strip-wrap { padding: 0 16px; transform: translateY(-22px); }
.earn-strip {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
}
.earn-card {
  background: var(--surface);
  border-radius: var(--r-lg);
  padding: 20px 16px;
  text-align: center;
  box-shadow: var(--sh-md);
  position: relative; overflow: hidden;
}
.earn-card::before {
  content: "";
  position: absolute; top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--accent), var(--accent-d));
}
.earn-card .earn-num {
  font-size: 28px; font-weight: 800; letter-spacing: -0.03em;
  color: var(--accent); line-height: 1; margin-bottom: 7px;
  font-variant-numeric: tabular-nums;
}
.earn-card .earn-label {
  font-size: 12px; font-weight: 600; color: var(--text-3); line-height: 1.4;
}

/* =====================================================
   SECCIÓN CONTAINER
   ===================================================== */
.content-body { padding: 0 16px; }

/* ---- Section titles ---- */
.section-label {
  font-size: 10.5px; font-weight: 700; letter-spacing: .11em;
  text-transform: uppercase; color: var(--text-3);
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 14px;
}
.section-label::after {
  content: ""; flex: 1; height: 1px;
  background: linear-gradient(90deg, rgba(0,0,0,.07), transparent);
}

/* =====================================================
   NIVELES
   ===================================================== */
.niveles { display: flex; flex-direction: column; gap: 10px; margin-bottom: 36px; }
.nivel {
  position: relative; overflow: hidden;
  display: flex; align-items: center; gap: 16px;
  background: linear-gradient(135deg, var(--dark-2) 0%, var(--dark-1) 100%);
  color: #fff;
  border-radius: var(--r-lg);
  padding: 18px 20px;
  box-shadow: var(--sh-md);
}
/* Acento lateral izquierdo */
.nivel::before {
  content: "";
  position: absolute; top: 0; left: 0; bottom: 0;
  width: 3px;
  background: linear-gradient(180deg, var(--accent), var(--accent-d));
  border-radius: 0 3px 3px 0;
}
/* Orbe decorativo */
.nivel::after {
  content: "";
  position: absolute; top: -30px; right: -30px;
  width: 100px; height: 100px; border-radius: 50%;
  background: radial-gradient(circle, rgba(26,188,254,.10) 0%, transparent 70%);
}
.nivel .n-badge {
  width: 44px; height: 44px; border-radius: 50%; flex: none;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,.07);
  border: 1.5px solid rgba(26,188,254,.25);
  font-size: 15px; font-weight: 800; color: var(--accent);
  flex-shrink: 0;
}
.nivel .n-body { flex: 1; min-width: 0; }
.nivel .n-name { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 2px; }
.nivel .n-desde { font-size: 12px; color: rgba(255,255,255,.40); font-weight: 500; }
.nivel .n-mult { text-align: right; flex-shrink: 0; }
.nivel .n-mult span { font-size: 10.5px; color: rgba(255,255,255,.40); font-weight: 600; display: block; margin-bottom: 1px; }
.nivel .n-mult b { font-size: 22px; font-weight: 800; color: var(--accent); letter-spacing: -0.03em; line-height: 1; }

/* =====================================================
   PREMIOS
   ===================================================== */
.rewards { display: flex; flex-direction: column; gap: 8px; margin-bottom: 36px; }
.reward {
  display: flex; align-items: center; gap: 14px;
  padding: 15px 16px; border-radius: var(--r-md);
  border: 1.5px solid rgba(0,0,0,.07);
  background: var(--surface);
  box-shadow: var(--sh-xs);
  transition: box-shadow .15s var(--ease), border-color .15s;
}
.reward:hover {
  border-color: var(--accent-mid);
  box-shadow: 0 0 0 2px var(--accent-glow), var(--sh-xs);
}
.reward .r-icon {
  width: 38px; height: 38px; border-radius: 10px; flex: none;
  display: flex; align-items: center; justify-content: center;
  background: var(--accent-soft);
  font-size: 18px; flex-shrink: 0;
}
.reward .r-name { font-size: 15px; font-weight: 700; flex: 1; color: var(--text-1); letter-spacing: -0.01em; }
.reward .r-pts {
  font-size: 13px; font-weight: 700; color: var(--accent);
  background: var(--accent-soft); padding: 4px 10px;
  border-radius: var(--r-pill);
  white-space: nowrap; flex-shrink: 0;
}

/* =====================================================
   CTA — REGISTRO
   ===================================================== */
.cta-registro {
  background: linear-gradient(135deg, var(--dark-2) 0%, var(--dark-1) 100%);
  border-radius: var(--r-xl);
  padding: 28px 24px;
  text-align: center;
  color: #fff;
  margin-bottom: 30px;
  position: relative; overflow: hidden;
  box-shadow: var(--sh-lg);
}
.cta-registro::before {
  content: "";
  position: absolute; top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
}
.cta-registro::after {
  content: "";
  position: absolute; bottom: -40px; right: -40px;
  width: 140px; height: 140px; border-radius: 50%;
  background: radial-gradient(circle, rgba(26,188,254,.08) 0%, transparent 70%);
}
.cta-registro h2 {
  font-size: 18px; font-weight: 800; letter-spacing: -0.03em;
  margin-bottom: 10px; position: relative; z-index: 1;
}
.cta-registro p {
  font-size: 13.5px; color: rgba(255,255,255,.6); line-height: 1.6;
  max-width: 320px; margin: 0 auto;
  font-weight: 500; position: relative; z-index: 1;
}
.cta-registro .cta-chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(26,188,254,.15);
  border: 1px solid rgba(26,188,254,.3);
  border-radius: var(--r-pill);
  padding: 6px 14px;
  font-size: 12px; font-weight: 700; color: var(--accent);
  margin-top: 16px; position: relative; z-index: 1;
}

/* =====================================================
   LOOKUP BOX — CONSULTA DE PUNTOS
   ===================================================== */
.lookup-box {
  background: var(--surface);
  border: 1.5px solid rgba(0,0,0,.08);
  border-radius: var(--r-xl);
  padding: 22px 20px;
  margin-bottom: 30px;
  box-shadow: var(--sh-sm);
  position: relative; overflow: hidden;
}
.lookup-box::before {
  content: "";
  position: absolute; top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--accent), var(--accent-d));
}
.lookup-header { margin-bottom: 16px; }
.lookup-header .lk-title {
  font-size: 15px; font-weight: 800; letter-spacing: -0.02em;
  color: var(--text-1); margin-bottom: 3px;
}
.lookup-header .lk-sub {
  font-size: 13px; color: var(--text-3); font-weight: 500;
}
.lookup-row {
  display: flex; gap: 8px;
}
.lookup-row .input-wrap {
  flex: 1; display: flex; align-items: center;
  border: 1.5px solid rgba(0,0,0,.10);
  border-radius: var(--r-md);
  background: var(--surface-2);
  transition: border-color .15s var(--ease), box-shadow .15s;
}
.lookup-row .input-wrap:focus-within {
  border-color: var(--accent);
  background: var(--surface);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
.lookup-row .prefix {
  padding: 0 2px 0 14px;
  font-weight: 700; color: var(--text-3); font-size: 16px;
  flex-shrink: 0;
}
.lookup-row input {
  flex: 1; min-width: 0; border: 0; background: transparent;
  padding: 13px 12px 13px 6px;
  font-family: var(--font); font-size: 17px; font-weight: 700;
  color: var(--text-1); outline: none;
  font-variant-numeric: tabular-nums;
  -webkit-appearance: none;
}
.lookup-row input::placeholder { color: var(--text-3); font-weight: 500; font-size: 15px; }

.lookup-btn {
  border: 0; border-radius: var(--r-md);
  background: linear-gradient(135deg, var(--accent), var(--accent-d));
  color: #fff;
  font-family: var(--font); font-weight: 700; font-size: 14px;
  padding: 0 20px; cursor: pointer;
  box-shadow: 0 3px 12px rgba(26,188,254,.30);
  transition: filter .15s, transform .1s;
  white-space: nowrap;
  min-height: 50px;
}
.lookup-btn:hover { filter: brightness(1.07); }
.lookup-btn:active { transform: scale(.97); }
.lookup-btn:disabled { opacity: .5; cursor: not-allowed; filter: none; }

.lookup-msg {
  font-size: 12.5px; font-weight: 600;
  margin-top: 10px; display: none;
  padding: 9px 12px; border-radius: var(--r-md);
}
.lookup-msg.show { display: block; }
.lookup-msg.error {
  background: #fde9e7; color: #b81c0d;
  border: 1px solid rgba(232,66,47,.2);
}

/* =====================================================
   TARJETA PERSONAL (resultado de búsqueda)
   ===================================================== */
#lookupResultado { margin-top: 16px; }

.personal-card {
  position: relative; overflow: hidden;
  background: linear-gradient(145deg, var(--dark-2) 0%, var(--dark-1) 100%);
  color: #fff;
  border-radius: var(--r-xl);
  padding: 24px 20px;
  box-shadow: var(--sh-lg);
  animation: cardIn .38s var(--ease);
}
.personal-card::before {
  content: "";
  position: absolute; top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--accent), rgba(26,188,254,.3));
}
.personal-card::after {
  content: "";
  position: absolute; top: -50px; right: -50px;
  width: 180px; height: 180px; border-radius: 50%;
  background: radial-gradient(circle, rgba(26,188,254,.10) 0%, transparent 70%);
}

.personal-card .p-tier {
  font-size: 10.5px; font-weight: 700; letter-spacing: .16em;
  text-transform: uppercase; color: var(--accent);
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 8px;
}
.personal-card .p-tier::after {
  content: ""; flex: 1; height: 1px;
  background: linear-gradient(90deg, rgba(26,188,254,.3), transparent);
}
.personal-card .p-name {
  font-size: 20px; font-weight: 800; letter-spacing: -0.03em;
  margin-bottom: 3px; line-height: 1.15;
}
.personal-card .p-id {
  font-size: 12px; color: rgba(255,255,255,.40); letter-spacing: .05em;
  margin-bottom: 18px; font-weight: 500;
}

/* Progress */
.p-progress-label {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 7px;
}
.p-progress-label span { font-size: 11px; color: rgba(255,255,255,.45); font-weight: 500; }
.p-progress-label b { font-size: 11px; color: var(--accent); font-weight: 700; }
.p-progress-track {
  height: 5px; background: rgba(255,255,255,.10);
  border-radius: 99px; overflow: hidden; margin-bottom: 20px;
}
.p-progress-fill {
  height: 100%; width: 0;
  background: linear-gradient(90deg, var(--accent), rgba(26,188,254,.6));
  border-radius: 99px;
  transition: width .8s var(--ease);
  box-shadow: 0 0 8px rgba(26,188,254,.45);
}

.personal-card .p-footer {
  display: flex; justify-content: space-between; align-items: flex-end;
  margin-bottom: 18px;
}
.personal-card .p-balance span {
  display: block; font-size: 10px; color: rgba(255,255,255,.45);
  text-transform: uppercase; letter-spacing: .1em; margin-bottom: 4px; font-weight: 600;
}
.personal-card .p-balance b {
  font-size: 32px; font-weight: 800; color: #fff; line-height: 1;
  letter-spacing: -0.03em; font-variant-numeric: tabular-nums;
}
.personal-card .p-hist {
  font-size: 12px; color: rgba(255,255,255,.35); font-weight: 500; text-align: right;
}

/* Mini rewards list */
.p-rewards { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.p-reward {
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: var(--r-md);
  padding: 10px 14px;
  font-size: 13px;
  transition: background .15s;
}
.p-reward.ready {
  background: rgba(26,188,254,.14);
  border-color: rgba(26,188,254,.25);
}
.p-reward .pr-name { font-weight: 600; color: rgba(255,255,255,.9); }
.p-reward .pr-status { font-weight: 700; color: rgba(255,255,255,.4); font-size: 12px; }
.p-reward.ready .pr-status { color: var(--accent); }

.p-cta {
  padding-top: 14px;
  border-top: 1px dashed rgba(255,255,255,.12);
  text-align: center;
  font-size: 12.5px; font-weight: 600; color: rgba(255,255,255,.55);
  line-height: 1.5;
}

/* Empty state */
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-3); }
.empty-state .glyph { font-size: 42px; margin-bottom: 14px; opacity: .4; }
.empty-state p { font-size: 14px; font-weight: 500; line-height: 1.6; max-width: 270px; margin: 0 auto; }

/* Footer */
.page-footer {
  text-align: center; padding: 0 16px;
  font-size: 12px; font-weight: 500; color: var(--text-3);
}

/* Keyframes */
@keyframes cardIn   { from{opacity:0;transform:translateY(12px);} to{opacity:1;transform:translateY(0);} }
@keyframes fadeUp   { from{opacity:0;transform:translateY(8px);}  to{opacity:1;transform:translateY(0);} }
</style>
</head>
<body>
<div class="app" id="app">

  <!-- HERO -->
  <div class="hero-wrap">
    <div class="topbar">
      <div class="logo-text">haztap<em>.</em></div>
      <div class="comercio-name" id="nombreComercio">Programa de fidelización</div>
    </div>
    <div class="hero-content">
      <div class="hero-eyebrow">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        Programa de Puntos
      </div>
      <h1>Entre más compras,<br><span>más ganas.</span></h1>
      <p>Sin apps, sin tarjetas físicas. Solo tu cédula en caja para acumular puntos y canjear premios.</p>
    </div>
  </div>

  <!-- EARN STRIP -->
  <div class="earn-strip-wrap">
    <div class="earn-strip" id="earnStrip">
      <!-- Poblado por JS -->
    </div>
  </div>

  <div class="content-body">

    <!-- LOOKUP BOX -->
    <div class="lookup-box">
      <div class="lookup-header">
        <div class="lk-title">Consulta tus puntos</div>
        <div class="lk-sub">Escribe tu cédula para ver tu nivel y premios disponibles.</div>
      </div>
      <div class="lookup-row">
        <div class="input-wrap">
          <span class="prefix">V-</span>
          <input id="inCedulaLookup" type="tel" inputmode="numeric"
                 placeholder="12345678" maxlength="9" autocomplete="off">
        </div>
        <button type="button" class="lookup-btn" id="btnLookup">Consultar</button>
      </div>
      <div class="lookup-msg" id="lookupMsg"></div>
      <div id="lookupResultado"></div>
    </div>

    <!-- CONTENIDO DINÁMICO (niveles, premios, CTA) -->
    <div id="contenido"></div>

    <!-- FOOTER -->
    <div class="page-footer">
      Haztap · Programa de fidelización
    </div>

  </div>
</div>

<!--
  Los datos se inyectan como texto plano (type="application/json"),
  nunca como JavaScript ejecutable.
-->
<script type="application/json" id="datos-servidor"><?!= datosJson ?></script>
<script>
(function(){
  var contenido       = document.getElementById('contenido');
  var earnStripEl     = document.getElementById('earnStrip');
  var nombreComercioEl = document.getElementById('nombreComercio');

  var DATOS = null;
  try {
    DATOS = JSON.parse(document.getElementById('datos-servidor').textContent);
  } catch(e) { DATOS = null; }

  if (!DATOS) {
    contenido.innerHTML =
      '<div class="empty-state">' +
        '<div class="glyph">◈</div>' +
        '<p>No pudimos cargar la información del programa en este momento.</p>' +
      '</div>';
    return;
  }

  if (DATOS.nombreComercio) {
    nombreComercioEl.textContent = 'Programa de fidelización · ' + DATOS.nombreComercio;
  }

  function escapeHtml(str){
    return String(str || '').replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }

  function iniciales(nombre){
    return String(nombre || '').trim().charAt(0).toUpperCase();
  }

  /* ---- Earn strip ---- */
  earnStripEl.innerHTML =
    '<div class="earn-card">' +
      '<div class="earn-num">' + DATOS.tasaBase + ' pts</div>' +
      '<div class="earn-label">por cada $1 en compras</div>' +
    '</div>' +
    '<div class="earn-card">' +
      '<div class="earn-num">' + DATOS.bonoBienvenida + ' pts</div>' +
      '<div class="earn-label">de regalo al registrarte</div>' +
    '</div>';

  var html = '';

  /* ---- Niveles ---- */
  html += '<div class="section-label">Niveles del programa</div>';
  html += '<div class="niveles">';
  (DATOS.niveles || []).forEach(function(n){
    html += '<div class="nivel">';
    html +=   '<div class="n-badge">' + iniciales(n.nombre) + '</div>';
    html +=   '<div class="n-body">';
    html +=     '<div class="n-name">' + escapeHtml(n.nombre) + '</div>';
    html +=     '<div class="n-desde">' + (n.desde > 0 ? 'Desde ' + n.desde.toLocaleString() + ' pts históricos' : 'Nivel de entrada') + '</div>';
    html +=   '</div>';
    html +=   '<div class="n-mult"><span>Multiplica</span><b>' + n.mult + 'x</b></div>';
    html += '</div>';
  });
  html += '</div>';

  /* ---- Premios ---- */
  if (DATOS.premios && DATOS.premios.length){
    html += '<div class="section-label">Premios canjeables</div>';
    html += '<div class="rewards">';
    DATOS.premios.forEach(function(p){
      html += '<div class="reward">';
      html +=   '<div class="r-icon">🎁</div>';
      html +=   '<div class="r-name">' + escapeHtml(p.nombre) + '</div>';
      html +=   '<div class="r-pts">' + p.puntos + ' pts</div>';
      html += '</div>';
    });
    html += '</div>';
  }

  /* ---- CTA ---- */
  html += '<div class="cta-registro">';
  html +=   '<h2>¿Aún no tienes cuenta?</h2>';
  html +=   '<p>Dicta tu cédula y tu WhatsApp en caja en tu próxima compra — el registro es gratis e inmediato.</p>';
  html +=   '<div class="cta-chip">';
  html +=     '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13.6a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 3h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 10.6a16 16 0 0 0 6 6l.91-.91a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 17.92z"/></svg>';
  html +=     'Solo tu cédula en caja';
  html +=   '</div>';
  html += '</div>';

  contenido.innerHTML = html;

  /* ================================================================
     CONSULTA PERSONAL — buscarCliente() del backend
  ================================================================ */
  var gScript = (window.google && google.script && google.script.run) ? google.script.run : null;
  var inLookup        = document.getElementById('inCedulaLookup');
  var btnLookup       = document.getElementById('btnLookup');
  var lookupMsg       = document.getElementById('lookupMsg');
  var lookupResultado = document.getElementById('lookupResultado');

  function soloDigitos(str){ return String(str || '').replace(/\D/g,''); }

  function mostrarMsg(texto){
    lookupMsg.textContent = texto;
    lookupMsg.className = 'lookup-msg show error';
  }
  function ocultarMsg(){ lookupMsg.className = 'lookup-msg'; }

  function buscar(){
    ocultarMsg();
    lookupResultado.innerHTML = '';
    var cedula = soloDigitos(inLookup.value);
    if (!cedula || cedula.length < 6){ mostrarMsg('Escribe una cédula válida.'); return; }
    if (!gScript){ mostrarMsg('Esta consulta solo funciona abriendo la página desde el enlace oficial.'); return; }

    btnLookup.disabled = true;
    btnLookup.textContent = 'Buscando...';

    gScript
      .withSuccessHandler(function(res){
        btnLookup.disabled = false;
        btnLookup.textContent = 'Consultar';
        if (!res || !res.ok){ mostrarMsg((res && res.mensaje) || 'No encontramos esa cédula.'); return; }
        renderTarjetaPersonal(res);
      })
      .withFailureHandler(function(){
        btnLookup.disabled = false;
        btnLookup.textContent = 'Consultar';
        mostrarMsg('No se pudo conectar. Intenta de nuevo.');
      })
      .buscarCliente(cedula);
  }

  function renderTarjetaPersonal(res){
    var prog = res.progreso || { pct: 0, label: '' };
    var alcanzables = (res.premios || []).filter(function(p){ return p.alcanza; });

    var h = '<div class="personal-card">';
    h += '<div class="p-tier">' + escapeHtml((res.nivel || 'MEMBER').toUpperCase()) + '</div>';
    h += '<div class="p-name">' + escapeHtml(res.nombre) + '</div>';
    h += '<div class="p-id">CI ' + escapeHtml(res.cedula) + '</div>';
    h += '<div class="p-progress-label"><span>' + escapeHtml(prog.label || '') + '</span><b>' + (prog.pct || 0) + '%</b></div>';
    h += '<div class="p-progress-track"><div class="p-progress-fill" id="pProgFill"></div></div>';
    h += '<div class="p-footer">';
    h +=   '<div class="p-balance"><span>Billetera</span><b>' + res.saldo + ' pts</b></div>';
    h +=   '<div class="p-hist">' + res.historico + ' pts históricos</div>';
    h += '</div>';

    if (res.premios && res.premios.length){
      h += '<div class="p-rewards">';
      res.premios.forEach(function(p){
        h += '<div class="p-reward' + (p.alcanza ? ' ready' : '') + '">';
        h +=   '<span class="pr-name">' + escapeHtml(p.nombre) + '</span>';
        h +=   '<span class="pr-status">' + (p.alcanza ? '✓ Listo para canjear' : 'Faltan ' + p.faltan + ' pts') + '</span>';
        h += '</div>';
      });
      h += '</div>';
    }

    h += '<div class="p-cta">' + (alcanzables.length
      ? '🎉 Muestra esta pantalla en caja para canjear tu premio'
      : 'Sigue comprando para desbloquear tu próximo premio 🚀') + '</div>';
    h += '</div>';

    lookupResultado.innerHTML = h;
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        var fill = document.getElementById('pProgFill');
        if (fill) fill.style.width = (prog.pct || 0) + '%';
      });
    });
  }

  btnLookup.addEventListener('click', buscar);
  inLookup.addEventListener('keydown', function(e){ if (e.key === 'Enter') buscar(); });
})();
</script>
</body>
</html>
